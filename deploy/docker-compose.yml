# Reno's own compose project, deliberately separate from secondbrain's.
#
# They share one thing — the Caddy already terminating TLS on this box — via
# an external network. Nothing else is shared: separate database, separate
# volumes, separate lifecycle. A bad deploy of one must not take the other
# down, and on a box with 1 GB of RAM that is not a theoretical concern.

name: reno

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reno
      POSTGRES_USER: reno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The dashboard writes little and reads a month at a time; the default
      # settings are generous for that and this box has no memory to spare.
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - reno-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reno -d reno']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    networks: [reno]

  web:
    image: reno-web:latest
    environment:
      DATABASE_URL: postgres://reno:${POSTGRES_PASSWORD}@db:5432/reno
      INGEST_TOKENS: ${INGEST_TOKENS:?set INGEST_TOKENS in .env}
      NODE_ENV: production
    volumes:
      # The live client link, read-only and never in the image. Create it
      # beside this file; deploy/client-tokens.example.json is the shape.
      - ./client-tokens.json:/run/secrets/client-tokens.json:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped
    networks: [reno, proxy]

volumes:
  reno-db:

networks:
  reno:
  # Created once by hand; Caddy is attached to it so it can reach `web`.
  proxy:
    external: true
    name: reno-proxy
